# Desired forge state reconciled by `bottown serve` on every start.
# Override by mounting a file at /data/bottown/bottown.toml.

org = "bottown"

# Scopes of the owner's token, used when the owner works through bottown
# (git push via the credential helper, API via the proxy).
owner_token_scopes = ["all"]

# Actors are the forge identities of coding agents. They are defined by the
# [[actors]] tables below (family = model vendor, for the cross-family review
# rule; harness = which CLI runs it).
actor_team = "actors"
# Forgejo gates PR reviews on write:repository, so every actor needs it.
actor_token_scopes = ["write:repository", "write:issue", "read:user", "read:organization", "read:notification"]

# Actors may start runs for themselves (e.g. `/bottown-implement 12` inside a
# harness), with the same checks as owner-started runs; they can never grant
# themselves a same-family review. Set to true to allow owner-started runs only.
disable_actor_self_start = false

# Accounts that existed in earlier designs. They are disabled (prohibit_login,
# which also rejects their tokens) but kept, so their history stays attributed.
retired = ["implementer", "verifier"]

# Teams cover every repository in the org. Unit permissions are read|write.
# Every actor joins one team: roles (implementer, verifier) are granted per
# run by bottown, not by forge permissions; protection keeps actors off the
# default branch.
[[teams]]
name = "actors"
units = { "repo.code" = "write", "repo.issues" = "write", "repo.pulls" = "write", "repo.releases" = "read", "repo.wiki" = "write" }

[[teams]]
name = "managers"
units = { "repo.code" = "write", "repo.issues" = "write", "repo.pulls" = "write", "repo.releases" = "write", "repo.wiki" = "write" }

[[actors]]
name = "claude"
family = "anthropic"
harness = "claude"

[[actors]]
name = "codex"
family = "openai"
harness = "codex"

[[actors]]
name = "agy"
family = "google"
harness = "antigravity"

[[actors]]
name = "kimi"
family = "moonshot"
harness = "kimi"

# The manager acts only inside bottown (merges, statuses) and never gets an
# API key.
[manager]
name = "manager"
full_name = "bottown manager"
team = "managers"
token_scopes = ["write:repository", "write:issue", "read:user", "read:organization"]

[[labels]]
name = "mode/ask"
color = "1d76db"
description = "Stop before merge and on anything unusual; wait for the owner"
exclusive = true

[[labels]]
name = "mode/auto"
color = "0e8a16"
description = "Merge once the verifier and checks are green (owner-set only)"
exclusive = true

[[labels]]
name = "needs/human"
color = "d93f0b"
description = "Escalated; only the owner clears it"

[protection]
required_approvals = 1
# Every actor's approval counts (the owner's too); add extra approvers here.
approvals_whitelist = []
merge_whitelist = ["manager"]
dismiss_stale_approvals = true
block_on_rejected_reviews = true
# Forgejo name for "admins cannot bypass approvals" (Gitea: block_admin_merge_override).
apply_to_admins = true
